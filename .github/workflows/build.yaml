name: Build

on:
    pull_request:
        paths-ignore:
            - 'README.md'
    push:
        branches:
            - main
            - '!gh-pages'

env:
    LC_APPLICATION_ID: oysteR

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rocker/verse:4
    
    steps:
      - uses: actions/checkout@v6

      - name: Install package dependencies
        run: R -e "devtools::install_deps(dep = TRUE)"

      - name: Build package
        run: R CMD build .

      - name: Configure CRAN repos
        run: |
          echo 'options(repos = c(CRAN = "https://cloud.r-project.org"))' > ~/.Rprofile

      - name: Check package
        run: R CMD check *tar.gz --as-cran

      - name: Move R built package
        run: mkdir -p built && mv oysteR_*.tar.gz built

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: check-results
          path: oysteR.Rcheck/

      - name: Upload built package
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: built-package
          path: built/

  sonatype:
        name: Sonatype Lifecycle
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Install R
              uses: r-lib/actions/setup-r@v2
              with:
                r-version: '3.5.3' # The R version to download (if necessary) and use.
                # Use "renv" to retrieve R version recorded in renv.lock file.

            - name: Generate cran-installed.packages
              run: Rscript -e 'sink("cran-installed.packages"); installed.packages()[,c(1,3:4)]'

            - name: Sonatype Lifecycle Evaluation
              id: evaluate
              uses: sonatype/actions/evaluate@v1
              with:
                  iq-server-url: ${{ vars.SONATYPE_PLATFORM_URL }}
                  username: ${{ secrets.SONATYPE_LIFECYCLE_USERNAME }}
                  password: ${{ secrets.SONATYPE_LIFECYCLE_PASSWORD }}
                  application-id: ${{ env.LC_APPLICATION_ID }}
                  scan-targets: 'cran-installed.packages'